<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KSPPER PARCHÍS</title><style>body{margin:0;background:#101a2d;color:white;font:16px system-ui;text-align:center}main{max-width:560px;margin:auto;padding:22px}button,input{padding:12px;border-radius:10px;border:0;margin:5px;font-size:16px}button{background:#ffd04d;cursor:pointer}input{width:160px}#board{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin:18px auto}#board div{aspect-ratio:1;border-radius:8px;background:#26354d;display:grid;place-items:center;font-weight:bold}.red{background:#d94b56!important}.blue{background:#3c87df!important}.green{background:#35a96a!important}.yellow{background:#c99b25!important}#pieces button{margin:8px}.hide{display:none}small{color:#bbc7d9}</style><main><h1>🎲 KSPPER PARCHÍS</h1><p>Salas privadas para jugar con amigos</p><section id="lobby"><input id="name" placeholder="Tu nombre" maxlength="20"><div><button onclick="socket.emit('create',name.value)">Crear sala</button></div><input id="code" placeholder="Código de sala" maxlength="6"><button onclick="socket.emit('join',{code:code.value,name:name.value})">Entrar como invitado</button></section><section id="room" class="hide"><h2>Sala: <span id="roomcode"></span></h2><button onclick="navigator.clipboard?.writeText(roomcode.textContent)">Copiar código</button><p id="players"></p><button id="start" onclick="socket.emit('start')">Iniciar partida</button></section><section id="game" class="hide"><h2 id="turn"></h2><p id="dice"></p><button onclick="socket.emit('roll')">🎲 Lanzar dado</button><div id="board"></div><p>Selecciona tu ficha para mover</p><div id="pieces"></div><small>Prototipo de Ludo con reglas simplificadas. Si se desconecta alguien, reinicia la sala.</small></section><p id="notice" role="status"></p></main><script src="/socket.io/socket.io.js"></script><script>const socket=io();let seat=-1;const colors=['red','blue','green','yellow'],symbols=['🔴','🔵','🟢','🟡'];socket.on('seat',i=>seat=i);socket.on('notice',msg=>notice.textContent=msg);socket.on('state',s=>{lobby.classList.add('hide');room.classList.remove('hide');roomcode.textContent=s.code;players.textContent=s.players.join(' · ');start.style.display=seat===0&&!s.started?'inline-block':'none';game.classList.toggle('hide',!s.started);if(!s.started)return;turn.textContent=s.winner>=0?'🏆 Ganó '+s.players[s.winner]:'Turno: '+s.players[s.turn]+(s.turn===seat?' (TÚ)':'');dice.textContent=s.rolled?'Dado: '+s.dice:'Esperando lanzamiento';let cells=Array.from({length:48},(_,i)=>[]);s.pieces.forEach((arr,p)=>arr.forEach((v,k)=>{if(v>=0&&v<48)cells[([0,12,24,36][p]+v)%48].push(symbols[p]);}));board.innerHTML=cells.map((a,i)=>'<div class="'+(a.length?colors[[0,12,24,36].findIndex(x=>a[0]===symbols[[0,12,24,36].indexOf(x)])]||'':'')+'">'+(a.join('')||'·')+'</div>').join('');pieces.innerHTML=s.pieces[seat]?.map((v,k)=>'<button '+(s.turn===seat&&s.rolled?'':'disabled')+' onclick="socket.emit(\'move\','+k+')">'+symbols[seat]+' Ficha '+(k+1)+' ('+(v<0?'casa':v===56?'meta':v)+')</button>').join('')||'';});</script></html>
